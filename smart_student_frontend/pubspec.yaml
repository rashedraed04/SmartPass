name: smart_student_frontend
description: "Smart Student Helper — A Flutter app for university students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  fl_chart: ^0.69.0
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  google_generative_ai: ^0.4.3
  flutter_dotenv: ^6.0.0
  share_plus: ^12.0.1
  google_fonts: ^6.1.0
  provider: ^6.1.2
  google_sign_in: ^6.2.1
  easy_localization: ^3.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/translations/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo_dark.png"
  adaptive_icon_background: "#071A0B"
  adaptive_icon_foreground: "assets/icons/app_logo_dark.png"
  min_sdk_android: 21
